services:
  backend:
    build: ./backend
    container_name: peaje-backend
    ports:
      - "8000:8000"
    environment:
      - ARCHIVO_ESTADO=/data/estado.json
    volumes:
      - datos:/data   # el contador y el registro sobreviven a stop/start y a reconstruir la imagen
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: peaje-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datos:
